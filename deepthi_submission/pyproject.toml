[project]
name = "epita-deepthi-dataanalytics"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepthi-bhavani", email = "deepthi-bhavani.bandaru@epita.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
epita-deepthi-cli = "epita_deepthi_dataanalytics.cli:main"





